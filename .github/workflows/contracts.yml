name: Contract checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install agent validation dependencies
        run: python -m pip install -r requirements-agent.txt
      - name: Validate bundle
        run: python scripts/validate_bundle.py .
      - name: Verify starter manifest
        run: sha256sum --check MANIFEST.sha256
      - name: Validate explicit project root
        run: python scripts/validate_project.py .
      - name: Verify active contract digest
        run: python scripts/check_active_contract_digest.py .
      - name: Run contract regression tests
        run: python -m pytest -q tests/test_contracts.py
      - name: Record contract digest
        run: python scripts/check_contract_freeze.py
