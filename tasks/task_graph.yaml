  owner_role: ExperimentOperator
  estimate_hours: 4
  gate: 1
  gpu_required: true
  human_approval_required: true
  actions:
  - RM 批量评分
  - 全量安全执行
  - 联结 candidate/group records
  acceptance_criteria:
  - 记录数一一对应
  - 无静默 infra error
  - top1 标签可构造
  outputs:
  - artifacts/corpus/smoke_labeled.parquet
  rollback: Revert task commit; preserve logs and failure report.
- id: T103
  title: 危险错误 prevalence 与伪影审计
  phase: G1-FailureAudit
  depends_on:
  - T102
  owner_role: ExperimentReviewer
  estimate_hours: 6
  gate: 1
  gpu_required: false
  human_approval_required: false
  actions:
