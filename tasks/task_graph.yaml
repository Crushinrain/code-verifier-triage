version: 1
policy:
  one_task_one_commit_or_pr: true
  agent_cannot_self_approve_gate: true
  gpu_task_requires_explicit_authorization: true
  contract_change_requires_change_request: true
tasks:
- id: T000
  title: 初始化仓库、分支保护与目录结构
  phase: G0-Governance
  depends_on: []
  owner_role: Planner
  estimate_hours: 2
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 从执行包复制 contracts/schemas/templates
  - 初始化 Git；启用 pre-commit 与 CI
  - 创建 THIRD_PARTY_NOTICES 与 LICENSE_AUDIT
  acceptance_criteria:
  - bundle validator 通过
  - main 分支禁止 Agent 直接提交
  - 一次任务对应一个 commit/PR
  outputs:
  - README.md
  - .gitignore
  - pyproject.toml
  - THIRD_PARTY_NOTICES.md
  rollback: Revert task commit; preserve logs and failure report.
- id: T001
  title: 采集主机、GPU、CPU、磁盘与拓扑清单
  phase: G0-Governance
  depends_on:
  - T000
  owner_role: ExperimentOperator
  estimate_hours: 2
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 运行 host inventory 命令
  - 记录 nvidia-smi topo -m
  - 确认 cgroups v2、Docker 与磁盘文件系统
  acceptance_criteria:
  - 生成 machine_inventory.json
  - 四卡均通过 30 分钟显存与通信 smoke
  - 磁盘满足最低空间
  outputs:
  - artifacts/inventory/machine_inventory.json
  - reports/gate0/hardware.md
  rollback: Revert task commit; preserve logs and failure report.
- id: T002
  title: 克隆并锁定上游 revision
  phase: G0-Governance
  depends_on:
  - T000
  owner_role: DataSteward
  estimate_hours: 3
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 克隆 CodeScaler/RewardUQ/SandboxFusion
  - 记录完整 SHA 与 diff 状态
  - 用 HF API 锁定模型和数据 revision
  acceptance_criteria:
  - upstream.lock.yaml 无 main/RESOLVE 占位
  - 所有 remote URL 与 SHA 可复现
  - 生成锁文件哈希
  outputs:
  - contracts/upstream.lock.yaml
  - artifacts/provenance/upstream_manifest.json
  rollback: Revert task commit; preserve logs and failure report.
- id: T003
  title: 许可证与可分发边界审计
  phase: G0-Governance
  depends_on:
  - T002
  owner_role: Reviewer
  estimate_hours: 3
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 核验仓库、模型、数据及其来源子集许可证
  - 明确复制源码、发布补丁、发布模型/数据的边界
  acceptance_criteria:
  - 每个依赖有 license_status 与证据 URL
  - CodeScaler 根仓许可证不明时只发布适配层/补丁
  - 无未经授权的权重或测试数据进入 Git
  outputs:
  - LICENSE_AUDIT.md
  - THIRD_PARTY_NOTICES.md
  rollback: Revert task commit; preserve logs and failure report.
- id: T004
  title: 建立隔离 Python/容器环境
  phase: G0-Governance
  depends_on:
  - T001
  - T002
  owner_role: Implementer
  estimate_hours: 6
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 建立 codescaler、rewarduq、orchestrator 三个环境
  - 优先复现上游 pin，不盲目升级依赖
  - 记录 pip/conda lock
  acceptance_criteria:
  - import smoke 通过
  - torch 能识别四卡
  - 环境 lock 与镜像 digest 入库
  outputs:
  - env/
  - artifacts/provenance/environment.json
  rollback: Revert task commit; preserve logs and failure report.
- id: T005
  title: 实现合同、Schema 与任务图 CI 校验
  phase: G0-Governance
  depends_on:
  - T000
  owner_role: Implementer
  estimate_hours: 4
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 接入 scripts/validate_bundle.py
  - 新增 CI 检查 YAML/JSON/任务依赖
  - 检查冻结 contract hash
  acceptance_criteria:
  - CI 对故意损坏的 schema/循环依赖会失败
  - 正常执行包全通过
  outputs:
  - .github/workflows/contracts.yml
  - tests/test_contracts.py
  rollback: Revert task commit; preserve logs and failure report.
- id: T010
  title: 导入 DeepCoder 问题注册表
  phase: G0-Data
  depends_on:
  - T004
  - T005
  owner_role: DataSteward
  estimate_hours: 6
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 下载 pin revision
  - 只提取问题元数据与测试引用
  - 生成 problem_hash
  acceptance_criteria:
  - 记录数与上游数据卡/脚本一致或解释差异
  - 测试文本不写入 prompt 字段
  - schema 验证通过
  outputs:
  - artifacts/registries/problems.parquet
  - reports/gate0/dataset_inventory.md
  rollback: Revert task commit; preserve logs and failure report.
- id: T011
  title: 去重、重叠与泄漏审计
  phase: G0-Data
  depends_on:
  - T010
  owner_role: DataSteward
  estimate_hours: 6
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - exact/normalized hash 去重
  - 检查 source/time 重叠
  - 输出 overlap matrix
  acceptance_criteria:
  - 同一 hash 不跨 split
  - 所有删除/合并有映射表
  - 外部 benchmark 重叠被记录
  outputs:
  - artifacts/registries/dedup_map.parquet
  - reports/gate0/overlap_report.json
  rollback: Revert task commit; preserve logs and failure report.
- id: T012
  title: 冻结 risk/RL/final split
  phase: G0-Data
  depends_on:
  - T011
  owner_role: DataSteward
  estimate_hours: 4
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 按 problem_hash/source 分层切分
  - 密封 final registry
  - 计算 split manifest hash
  acceptance_criteria:
  - row-level random split 被测试禁止
  - final 文件只读且 hash 固定
  - split balance 报告完成
  outputs:
  - contracts/dataset_split.lock.yaml
  - artifacts/registries/*.parquet
  rollback: Revert task commit; preserve logs and failure report.
- id: T013
  title: 实现统一 prompt renderer
  phase: G0-Protocol
  depends_on:
  - T012
  owner_role: Implementer
  estimate_hours: 6
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 复现上游 prompt
  - 确保测试用例不进入 prompt
  - 保存 rendered prompt 与 hash
  acceptance_criteria:
  - 100 个样本与上游预期格式对齐
  - prompt 中无 test 字段
  - token 长度统计完整
  outputs:
  - src/prompts/renderer.py
  - tests/test_prompt_no_leakage.py
  rollback: Revert task commit; preserve logs and failure report.
- id: T014
  title: 实现 canonical code extractor
  phase: G0-Protocol
  depends_on:
  - T013
  owner_role: Implementer
  estimate_hours: 6
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 实现单代码块规则
  - 定义错误枚举
  - 保留 raw response 与 extracted code
  acceptance_criteria:
  - 所有 golden cases 通过
  - 无 train/eval 分支函数
  - 确定性与幂等性通过
  outputs:
  - src/extraction/canonical.py
  - tests/test_extraction_golden.py
  rollback: Revert task commit; preserve logs and failure report.
- id: T015
  title: 审计并统一上游 train/eval 提取差异
  phase: G0-Protocol
  depends_on:
  - T014
  owner_role: Reviewer
  estimate_hours: 4
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 对上游两个 extractor 做差分测试
  - 统计 1000 样本分歧
  - 提交适配补丁
  acceptance_criteria:
  - 分歧原因有分类
  - 本项目所有路径只调用 canonical extractor
  - 回归测试覆盖
  outputs:
  - reports/gate0/extraction_parity.md
  - patches/codescaler_extraction.patch
  rollback: Revert task commit; preserve logs and failure report.
- id: T016
  title: 实现 CodeScaler-1.7B scoring adapter
  phase: G0-Protocol
  depends_on:
  - T004
  - T014
  owner_role: Implementer
  estimate_hours: 8
  gate: 0
  gpu_required: true
  human_approval_required: true
  actions:
  - 封装 chat template、batching 与分数输出
  - 保存 actual RM input/token/hash
  - 实现 OOM backoff
  acceptance_criteria:
  - 重复性、批序、单/批 parity 通过
  - NaN/Inf 触发失败
  - 每个分数可追溯到输入 hash
  outputs:
  - src/scoring/codescaler_adapter.py
  - tests/test_rm_scoring.py
  rollback: Revert task commit; preserve logs and failure report.
- id: T017
  title: RM 输入模式与截断审计
  phase: G0-Protocol
  depends_on:
  - T016
  owner_role: ExperimentOperator
  estimate_hours: 6
  gate: 0
  gpu_required: true
  human_approval_required: true
  actions:
  - 比较 upstream exact 与 question+code
  - 检查 2K/3K/4K 生成上限
  - 统计代码尾部可见率与 rank 变化
  acceptance_criteria:
  - 冻结 input_mode/max_length/truncation_side
  - silent truncation 为零或明确隔离
  - cap-hit <5% 或说明上调
  outputs:
  - contracts/rm_scoring.lock.yaml
  - reports/gate0/rm_input_audit.md
  rollback: Revert task commit; preserve logs and failure report.
- id: T018
  title: 部署并锁定隔离执行服务
  phase: G0-Security
  depends_on:
  - T001
  - T002
  - T004
  owner_role: SecurityReviewer
  estimate_hours: 8
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 从 pin 源码构建镜像
  - 记录 Dockerfile/image digest
  - 配置无网络、非 root、cgroups v2 与输出限制
  acceptance_criteria:
  - 服务健康检查通过
  - 容器无项目源码/密钥挂载
  - 镜像 digest 固定
  outputs:
  - infra/sandbox/
  - artifacts/provenance/sandbox_image.json
  rollback: Revert task commit; preserve logs and failure report.
- id: T019
  title: 执行沙箱安全与故障语义验收
  phase: G0-Security
  depends_on:
  - T018
  owner_role: SecurityReviewer
  estimate_hours: 8
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 运行全部 adversarial fixtures
  - 验证 timeout/OOM 后服务恢复
  - 区分答案错误与 INFRA_ERROR
  acceptance_criteria:
  - 无宿主文件/网络访问
  - fork/memory/output bomb 被限制
  - INFRA_ERROR 不映射 reward=0
  outputs:
  - reports/gate0/sandbox_acceptance.md
  - tests/security/
  rollback: Revert task commit; preserve logs and failure report.
- id: T020
  title: 实现 execution adapter、缓存与状态枚举
  phase: G0-Protocol
  depends_on:
  - T014
  - T019
  owner_role: Implementer
  estimate_hours: 8
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 实现请求/重试/缓存
  - cache key 包含 code/test/image/limits
  - 限制 stdout/stderr
  acceptance_criteria:
  - 已知正确/错误样本结果确定
  - infra error 不缓存
  - timeout 清理整个进程树
  outputs:
  - src/execution/adapter.py
  - src/execution/cache.py
  - tests/test_execution.py
  rollback: Revert task commit; preserve logs and failure report.
- id: T021
  title: 建立 evaluator parity 与 Oracle 强度审计
  phase: G0-Protocol
  depends_on:
  - T020
  owner_role: Reviewer
  estimate_hours: 6
  gate: 0
  gpu_required: false
  human_approval_required: false
  actions:
  - 比较本地 evaluator 与上游评测
  - 定义 train/audit/final suite
  - 对已知解和 mutation 样本做敏感性检查
  acceptance_criteria:
  - parity 差异为零或有书面豁免
  - 有限测试通过只称 test-suite success
  - final evaluator 冻结
  outputs:
  - contracts/evaluation.lock.yaml
  - reports/gate0/evaluator_parity.md
  rollback: Revert task commit; preserve logs and failure report.
- id: T022
  title: 全链路资源与成本审计
  phase: G0-Cost
  depends_on:
  - T016
  - T020
  - T021
  owner_role: ExperimentOperator
  estimate_hours: 8
  gate: 0
  gpu_required: true
  human_approval_required: true
  actions:
  - 对至少 1000 candidates 测 RM 与执行
  - 记录 GPU-s/CPU-s/wall-clock/p50/p95
  - 测并发与 timeout
  acceptance_criteria:
  - 混合系统成本公式可计算
  - 明确 cost claim 是否允许
  - 同一硬件和并发配置
  outputs:
  - reports/gate0/cost_audit.md
  - artifacts/metrics/cost_raw.parquet
  rollback: Revert task commit; preserve logs and failure report.
- id: T023
  title: Gate 0 评审与合同冻结
  phase: G0-Review
  depends_on:
  - T003
  - T005
  - T012
  - T015
  - T017
  - T019
  - T021
  - T022
  owner_role: ExperimentReviewer
  estimate_hours: 4
  gate: 0
  gpu_required: false
  human_approval_required: true
  actions:
  - 汇总协议、成本、安全与差异
  - 冻结 contracts hash
  - 形成 go/no-go
  acceptance_criteria:
  - 所有阻断问题关闭
  - 存在明确主 claim（cost 或 reliability）
  - 人工签署 gate review
  outputs:
  - reports/gates/GATE0.md
  - artifacts/provenance/contracts.sha256
  rollback: Revert task commit; preserve logs and failure report.
- id: T100
