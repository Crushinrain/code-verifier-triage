  - 按 problem shard/seed 生成
  - 原子写入与断点恢复
  - schema 校验
  acceptance_criteria:
  - 中断后无重复/缺失
  - 固定 seed 可复现
  - 每候选有完整 provenance
  outputs:
  - src/generation/runner.py
  - tests/test_generation_resume.py
  rollback: Revert task commit; preserve logs and failure report.
- id: T101
