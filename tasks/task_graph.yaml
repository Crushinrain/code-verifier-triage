  - 人工复核至少 50 个 FP
  acceptance_criteria:
  - FP 不是主要由协议 bug 造成
  - 报告置信区间
  - 决定是否扩大数据
  outputs:
  - reports/gate1/prevalence_audit.md
  rollback: Revert task commit; preserve logs and failure report.
